
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bomb Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="puzzleSection">
    <div class="numbers">
      <h3 class="num1">1</h3>
      <h3 class="num2">2</h3>
      <h3 class="stringClass"></h3>
    </div>
    <input type="number">
  </div>

  <div class="section">
    <h1>💣 Bomb Countdown</h1>

    <div class="hideSection">
      <h2>15</h2>
      <h3>second remaining</h3>
      <button>Defuse Bomb</button>
    </div>

    <div class="result">
      <h1 class="resultHeading"></h1>
    </div>
  </div>

  <audio id="blastSound"
    src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"
    preload="auto">
  </audio>

  <script src="script.js"></script>
</body>
</html>
